# Paths are relative to the Git repository root.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# The checked-in PDF is copied into the HTML site's download assets by Sphinx.
# Rebuild and commit it separately when guide content changes.
formats:
  - htmlzip
